name: pytest

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: canary
          POSTGRES_PASSWORD: canary
          POSTGRES_DB: canary
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U canary -d canary"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+psycopg2://canary:canary@localhost:5432/canary

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Run Alembic migrations
        run: alembic -c infra/alembic.ini upgrade head

      - name: Run tests
        run: pytest
