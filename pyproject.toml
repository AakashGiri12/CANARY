[project]
name = "canary"
version = "0.1.0"
description = "Adversarial agent security: adaptive prompt-injection attacker vs. defended target agent"
requires-python = ">=3.11"
readme = "README.md"

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "langgraph>=0.2",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "celery>=5.4",
    "redis>=5.0",
    "psycopg2-binary>=2.9",
    "pgvector>=0.3",
    "structlog>=24.1",
    "openai>=1.40",
    "pydantic>=2.8",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
# Torch-dependent. Recent PyTorch has dropped Intel Mac wheels (see root
# CLAUDE.md), so this extra is NOT installed on the Intel dev laptop — only
# on the Oracle ARM VM (embedding inference) and Kaggle/Colab (classifier
# training). Local unit tests mock embeddings instead of installing this.
ml = [
    "sentence-transformers>=3.0",
    "transformers>=4.44",
    "datasets>=2.20",
    "scikit-learn>=1.4",
    "huggingface_hub>=0.24",
    "pandas>=2.2",
]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
    "target_agent",
    "attack_engine",
    "defense_layer",
    "eval_harness",
    "api",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
